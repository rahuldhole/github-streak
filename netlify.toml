[build]
  command = "bun run test"
  publish = "public"
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!browser-extension'"

[[edge_functions]]
  path = "/*"
  excludedPath = ["/og.png", "/og/*", "/.netlify/images"]
  function = "server"
[functions]
  included_files = ["netlify/functions/assets/**", "public/assets/icons/**"]
